name: Actualizacion Mensual de Precios

on:
  schedule:
    # Se ejecuta el día 1 de cada mes a las 03:00 AM (UTC)
    - cron: '0 3 1 * *'
  workflow_dispatch: # Este comando te agrega un botón para correrlo a mano cuando quieras probar

jobs:
  scraping:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el motor de extracción
        run: python scraper.py

      - name: Guardar y subir los datos nuevos (Commit & Push)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "🤖 Actualización automática de precios y foto histórica" || echo "No hay cambios para commitear"
          git push
